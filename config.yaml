# The Semantic Entropy Engine - Configuration File

system:
  name: "The Semantic Entropy Engine"
  version: "1.0.0"
  domain: "Academic Institutions (Faculty Conduct, Attendance, Exams, Grading, Eligibility, Health, Financial Aid, Housing, Safety, Internships)"
  demo_mode: true
  seed: 42

chunking:
  chunk_size: 500  # Target tokens/words per chunk
  chunk_overlap: 75 # 15% overlap
  min_chunk_len: 30

retrieval:
  collection_name: "institution_policies"
  top_k_round_1: 8
  top_k_increment: 6
  similarity_threshold: 0.55 # Below this, retrieval is not trustworthy -> retrieve_more/abstain
  domain_threshold: 0.55 # Min evidence similarity for grounded answer
  min_evidence_similarity: 0.55

context_engineering:
  max_evidence_tokens: 1800 # CONTEXT_TOKEN_BUDGET=1800
  dedup_similarity_threshold: 0.90
  enable_reranking: true
  source_tag_prefix: "[SOURCE: "
  source_tag_suffix: "]"

generation:
  model_provider: "huggingface" # "huggingface" | "demo" | "ollama" | "openai"
  model_name: "google/flan-t5-base"
  num_candidates: 5 # NUM_CANDIDATES=5
  temperature: 0.9 # GENERATION_TEMPERATURE=0.9
  top_p: 0.95
  max_tokens: 250

nli:
  model_name: "cross-encoder/nli-deberta-v3-small"
  entailment_threshold: 0.50

entropy:
  clustering_method: "union_find_bidirectional"
  fixed_rule_entropy_threshold: 0.70 # <= this with good similarity -> "Grounded"
  fixed_rule_similarity_threshold: 0.55
  entropy_low_threshold: 0.70
  entropy_high_threshold: 0.75 # >= this -> abstain regardless of similarity
  general_knowledge_entropy_threshold: 0.35
  max_retrieval_rounds: 2 # MAX_RETRIEVAL_ROUNDS=2

policy:
  mode: "fixed_rule" # "fixed_rule" | "ppo"
  checkpoint_dir: "models/policy_checkpoints"

reward_weights:
  w_correct: 1.0
  w_halluc: -1.5
  w_cost: -0.1
  w_good_abstain: 0.5
  w_bad_abstain: -0.7

storage:
  db_path: "storage/app.db"
  eval_dataset_path: "storage/eval_dataset.jsonl"
  logs_dir: "logs"
